name: Weekly Startup Briefing

# Every Wednesday at 08:00 Singapore time (00:00 UTC) through 31 Dec 2027:
# research the past week's top South East Asia startups with Claude Code (headless,
# limited to web search/fetch plus read/write inside this checkout), write
# briefings/<run-date>-briefing.md, commit it to main and redeploy the site.
#
# Requires the repository secret ANTHROPIC_API_KEY.
# GitHub cron has no end date, so the first step exits once the date passes 2027-12-31.

on:
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs:
      week_end:
        description: 'Override week end date (YYYY-MM-DD, a Wednesday). Default: today.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: "weekly-briefing"
  cancel-in-progress: false

jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Stop after 31 Dec 2027
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "2027-12-31" ]]; then
            echo "Schedule ended on 2027-12-31 (today is $TODAY). Exiting without running."
            echo "ENDED=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.ENDED != '1'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.ENDED != '1'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: briefing-app/package-lock.json

      - name: Install app dependencies and Claude Code
        if: env.ENDED != '1'
        run: |
          (cd briefing-app && npm ci)
          npm install -g @anthropic-ai/claude-code

      - name: Compute week window
        if: env.ENDED != '1'
        run: |
          set -euo pipefail
          END="${{ github.event.inputs.week_end }}"
          if [[ -z "$END" ]]; then END=$(date -u +%Y-%m-%d); fi
          START=$(date -u -d "$END - 6 days" +%Y-%m-%d)
          SM=$(date -u -d "$START" +%B); SD=$(date -u -d "$START" +%-d)
          EM=$(date -u -d "$END" +%B);   ED=$(date -u -d "$END" +%-d); EY=$(date -u -d "$END" +%Y)
          if [[ "$SM" == "$EM" ]]; then LABEL="$SM $SD–$ED, $EY"; else LABEL="$SM $SD – $EM $ED, $EY"; fi
          echo "WEEK_START=$START" >> "$GITHUB_ENV"
          echo "WEEK_END=$END"     >> "$GITHUB_ENV"
          echo "WEEK_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "OUT_FILE=briefings/$END-briefing.md" >> "$GITHUB_ENV"
          echo "Window: $START to $END -> $LABEL"

      - name: Skip if this week's file already exists
        if: env.ENDED != '1'
        run: |
          if [[ -f "$OUT_FILE" ]]; then
            echo "$OUT_FILE already exists; nothing to do."
            echo "ENDED=1" >> "$GITHUB_ENV"
          fi

      - name: Export list of companies already covered
        if: env.ENDED != '1'
        run: |
          node -e '
            import("./briefing-app/scripts/dedupe-briefings.js").then(m => {
              const e = m.loadEntries();
              const lines = e.map(x => `${x.name}${x.domain ? " (" + x.domain + ")" : ""} — covered ${x.date}`);
              require("fs").writeFileSync("covered-companies.txt",
                "Companies already covered in earlier briefings (never include these):\n" + lines.join("\n") + "\n");
              console.log(e.length, "companies already covered");
            })'

      - name: Research and write the weekly briefing with Claude Code
        if: env.ENDED != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          PROMPT="$(cat docs/weekly-briefing-protocol.md)

          ## This run
          - Week window: ${WEEK_START} to ${WEEK_END} (inclusive). Today is ${WEEK_END}.
          - Header line to use exactly: \`## Week of ${WEEK_LABEL} · Weekly Edition\`
          - Output file (write exactly this path, nothing else in the repo): \`${OUT_FILE}\`
          - Exclusion list of previously covered companies: covered-companies.txt in the repo root (read it first).
          "
          # Headless run limited to research tools and file I/O inside this checkout.
          # Only the listed tools are permitted; anything else is refused in -p mode.
          claude -p "$PROMPT" \
            --max-turns 400 \
            --output-format text \
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(node briefing-app/scripts/*)" \
            | tail -n 60

      - name: Validate the new briefing
        if: env.ENDED != '1'
        run: |
          set -euo pipefail
          rm -f covered-companies.txt
          test -f "$OUT_FILE" || { echo "::error::Claude did not write $OUT_FILE"; exit 1; }
          grep -q '· Weekly Edition' "$OUT_FILE" || { echo "::error::Missing Weekly Edition header"; exit 1; }
          N=$(grep -c '^### [0-9]' "$OUT_FILE")
          echo "Companies in new briefing: $N"
          [[ "$N" -ge 3 ]] || { echo "::error::Only $N companies; refusing to publish"; exit 1; }
          node briefing-app/scripts/dedupe-briefings.js
          node briefing-app/scripts/parse-briefings.js
          git status --short
          CHANGED=$(git status --porcelain | grep -v " $OUT_FILE$" | grep -v "briefing-app/src/data/" || true)
          if [[ -n "$CHANGED" ]]; then echo "::error::Unexpected changes:"; echo "$CHANGED"; exit 1; fi

      - name: Commit the briefing to main
        if: env.ENDED != '1'
        run: |
          set -euo pipefail
          N=$(grep -c '^### [0-9]' "$OUT_FILE")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_FILE"
          git commit -m "Weekly briefing: ${WEEK_LABEL} (${N} companies)" -m "Generated by the scheduled Weekly Startup Briefing workflow."
          git push origin main

      - name: Build site
        if: env.ENDED != '1'
        working-directory: briefing-app
        env:
          BRIEFING_PASSWORD: ${{ secrets.BRIEFING_PASSWORD }}
        run: npm run build

      - name: Deploy to gh-pages
        if: env.ENDED != '1'
        run: |
          set -euo pipefail
          BRIEFINGS=$(ls briefings/*-briefing.md | wc -l)
          COMPANIES=$(grep -h '^### [0-9]' briefings/*-briefing.md | wc -l)
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          git checkout -B gh-pages
          git rm -rq . || true
          cp -r "$GITHUB_WORKSPACE/briefing-app/dist/." .
          git add -A
          git commit -m "Deploy: weekly briefing ${WEEK_LABEL} (${BRIEFINGS} briefings, ${COMPANIES} companies)" -m "Built from main by the Weekly Startup Briefing workflow."
          git push origin gh-pages
